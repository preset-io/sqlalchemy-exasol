# Preset fork only. Not an exasol-toolbox template.
#
# Replacement static-analysis gate for the upstream "Upload to Sonar" step,
# which targets Exasol's own SonarQube organization and cannot be authenticated
# from a fork. This does not replace any lint, typing, security or test job —
# those all still run unchanged.
name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Python
    # Scoped so that behaviour is unchanged for exasol/sqlalchemy-exasol and any
    # other fork; only this fork runs CodeQL in place of the Sonar upload.
    if: github.repository == 'preset-io/sqlalchemy-exasol'
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out Repository
        id: check-out-repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        id: initialize-codeql
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: python
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        id: perform-codeql-analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:python"
